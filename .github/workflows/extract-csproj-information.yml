name: Extract release information

on:
  workflow_call:
    inputs:
      csproj-path:
        description: Path to the .csproj or .props file
        required: false
        default: Directory.Build.props
        type: string
    outputs:
      version:
        description: The resolved package version
        value: ${{ jobs.extract_information.outputs.version }}
      changelog:
        description: The changelog entry for the resolved version
        value: ${{ jobs.extract_information.outputs.changelog }}

permissions:
  contents: read

jobs:
  extract_information:
    name: Extract release information
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.extract.outputs.version }}
      changelog: ${{ steps.extract.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version and changelog
        id: extract
        shell: bash
        env:
          PROJECT_FILE: ${{ inputs.csproj-path }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import uuid
          import xml.etree.ElementTree as ET
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          project_file = (workspace / os.environ["PROJECT_FILE"]).resolve()

          try:
              project_file.relative_to(workspace)
          except ValueError:
              raise SystemExit(f"::error::Project file must be inside the workspace: {project_file}")

          if not project_file.is_file():
              raise SystemExit(f"::error::Project file not found: {project_file}")

          try:
              root = ET.parse(project_file).getroot()
          except ET.ParseError as error:
              raise SystemExit(f"::error::Invalid project XML in {project_file}: {error}") from error

          properties = {}
          for element in root.iter():
              name = element.tag.rsplit("}", 1)[-1]
              value = (element.text or "").strip()
              if value and name not in properties:
                  properties[name] = value

          raw_version = properties.get("Version")
          if not raw_version and properties.get("VersionPrefix"):
              raw_version = properties["VersionPrefix"]
              if properties.get("VersionSuffix"):
                  raw_version += f"-{properties['VersionSuffix']}"
          raw_version = raw_version or properties.get("AssemblyVersion")

          if not raw_version:
              raise SystemExit(
                  f"::error::No Version, VersionPrefix, or AssemblyVersion was found in {project_file}"
              )

          property_reference = re.compile(r"\$\(([^)]+)\)")
          version = raw_version
          for _ in range(10):
              expanded = property_reference.sub(
                  lambda match: properties.get(match.group(1), match.group(0)), version
              )
              if expanded == version:
                  break
              version = expanded

          unresolved = property_reference.findall(version)
          if unresolved:
              names = ", ".join(sorted(set(unresolved)))
              raise SystemExit(f"::error::Unresolved MSBuild properties in version: {names}")

          nuget_version = re.compile(
              r"^[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          if not nuget_version.fullmatch(version):
              raise SystemExit(f"::error::Invalid NuGet version in {project_file}: {version}")

          changelog_file = workspace / "CHANGELOG.md"
          if not changelog_file.is_file():
              raise SystemExit("::error::CHANGELOG.md not found")

          lines = changelog_file.read_text(encoding="utf-8-sig").splitlines()
          escaped_version = re.escape(version)
          version_header = re.compile(
              rf"^#{{1,6}}\s+\[?v?{escaped_version}\]?"
              rf"(?:\s+(?:\([^)]+\)|-\s+\d{{4}}-\d{{2}}-\d{{2}}))?\s*$"
          )
          any_version_header = re.compile(
              r"^#{1,6}\s+\[?v?[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?\]?"
              r"(?:\s|$)"
          )

          matches = [index for index, line in enumerate(lines) if version_header.fullmatch(line)]
          if not matches:
              raise SystemExit(f"::error::Could not find version {version} in CHANGELOG.md")
          if len(matches) > 1:
              raise SystemExit(f"::error::Found multiple changelog headings for version {version}")

          start = matches[0] + 1
          end = next(
              (index for index in range(start, len(lines)) if any_version_header.match(lines[index])),
              len(lines),
          )
          changelog = "\n".join(lines[start:end]).strip()
          if not changelog:
              raise SystemExit(f"::error::Empty changelog for version {version}")

          output_file = Path(os.environ["GITHUB_OUTPUT"])
          delimiter = f"changelog_{uuid.uuid4().hex}"
          with output_file.open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"changelog<<{delimiter}\n{changelog}\n{delimiter}\n")

          print(f"Resolved version: {version}")
          print("Extracted changelog entry:")
          print(changelog)
          PY
