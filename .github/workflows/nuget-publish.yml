name: Publish NuGet package

on:
  workflow_call:
    inputs:
      dry_run:
        description: Pack and upload an artifact without publishing a release
        required: false
        default: true
        type: boolean
      project-path:
        description: Project, solution, or directory passed to dotnet pack
        required: false
        default: .
        type: string
      csproj-path:
        description: Project or props file containing the package version
        required: false
        default: Directory.Build.props
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      dotnet-version:
        description: .NET SDK version installed by setup-dotnet
        required: false
        default: 10.0.x
        type: string
      publish-github-packages:
        description: Also publish packages to GitHub Packages
        required: false
        default: true
        type: boolean
    secrets:
      NUGET_TOKEN:
        description: NuGet.org API key; required when dry_run is false
        required: false
    outputs:
      version:
        description: The published or packed package version
        value: ${{ jobs.release_information.outputs.version }}

  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and upload an artifact without publishing a release
        required: false
        default: true
        type: boolean
      project-path:
        description: Project, solution, or directory passed to dotnet pack
        required: false
        default: .
        type: string
      csproj-path:
        description: Project or props file containing the package version
        required: false
        default: Directory.Build.props
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      dotnet-version:
        description: .NET SDK version installed by setup-dotnet
        required: false
        default: 10.0.x
        type: string
      publish-github-packages:
        description: Also publish packages to GitHub Packages
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_information:
    name: Read release information
    permissions:
      contents: read
    uses: ./.github/workflows/extract-csproj-information.yml
    with:
      csproj-path: ${{ inputs.csproj-path }}

  pack:
    name: Pack NuGet package
    needs: release_information
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Pack
        shell: bash
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          PACKAGE_VERSION: ${{ needs.release_information.outputs.version }}
          PROJECT_PATH: ${{ inputs.project-path }}
        run: |
          set -euo pipefail
          dotnet pack "$PROJECT_PATH" \
            --configuration "$CONFIGURATION" \
            --output "$RUNNER_TEMP/packages" \
            --property:ContinuousIntegrationBuild=true \
            --property:PackageVersion="$PACKAGE_VERSION" \
            --nologo

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ needs.release_information.outputs.version }}
          path: |
            ${{ runner.temp }}/packages/*.nupkg
            ${{ runner.temp }}/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Dry-run summary
        if: inputs.dry_run
        env:
          PACKAGE_VERSION: ${{ needs.release_information.outputs.version }}
        run: echo "### Dry run complete — v${PACKAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish NuGet package
    if: ${{ !inputs.dry_run }}
    needs:
      - release_information
      - pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate NuGet.org credentials
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_TOKEN" ]; then
            echo "::error::The NUGET_TOKEN secret is required when dry_run is false."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages-${{ needs.release_information.outputs.version }}
          path: packages

      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No NuGet packages were downloaded."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_TOKEN" \
              --skip-duplicate
          done

      - name: Publish to GitHub Packages
        if: inputs.publish-github-packages
        shell: bash
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.nupkg)
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "$PACKAGE_SOURCE" \
              --api-key "$GITHUB_PACKAGES_TOKEN" \
              --skip-duplicate
          done

      - name: Create Git tag
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ needs.release_information.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [ "$tagged_commit" != "$COMMIT_SHA" ]; then
              echo "::error::${tag} already points to ${tagged_commit}, not ${COMMIT_SHA}."
              exit 1
            fi
            echo "${tag} already points to this commit; keeping the existing tag."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release ${tag}" "$COMMIT_SHA"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.release_information.outputs.version }}
          name: v${{ needs.release_information.outputs.version }}
          body: ${{ needs.release_information.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(needs.release_information.outputs.version, '-') }}
          files: |
            packages/*.nupkg
            packages/*.snupkg
